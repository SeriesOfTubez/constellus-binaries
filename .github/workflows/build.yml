name: build-binaries

on:
  workflow_dispatch:
  # A pull request runs `verify` only — it proves the security gate still passes
  # and the image still builds, and it must not publish. Same split the
  # cloud-ranges workflow already uses; see the `publish` job's `if:` below.
  pull_request:
    paths:
      - "binaries/**"
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "binaries/**"
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
  schedule:
    # Weekly re-scan: re-run govulncheck/Trivy against the published pins so a
    # newly-disclosed reachable vuln fails the build even without a version bump.
    - cron: "0 6 * * 1"

# Deliberately NO workflow-level `permissions:` block. Each job declares its own,
# so a pull_request run cannot write packages or attestations even in principle —
# not merely "does not happen to". The whole point of this repo is that what we
# publish is attested, so the boundary is worth more than the convenience.

jobs:
  # ── Gate: runs everywhere, publishes nothing ────────────────────────────────
  # This is the job that decides whether a binary is fit to ship. Running it on
  # pull_request is the point of the split: previously it fired only on push to
  # main, so a change to the gate itself got its first execution *after* merge,
  # on the branch where a failure blocks publishing rather than a review.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # A dependency whose go directive outruns GO_VERSION must FAIL, not silently
      # pull a newer toolchain (Go's default is GOTOOLCHAIN=auto). Otherwise
      # GO_VERSION stops being binding and — worse — this gate and the Docker build
      # can resolve different toolchains, so the gate would verify a different
      # standard library than the one that ships. This is not hypothetical: it is
      # what forced GO_VERSION off the 1.25 line (planning#185) when x/vuln v1.8.0
      # and projectdiscovery/utils#785 both moved to `go 1.26.0`.
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        # Add a binary: create binaries/<name>/ (build.env + Dockerfile) and list
        # it here AND in `publish` below — the two matrices must stay in step.
        binary: [zgrab2, cdncheck]
    steps:
      - uses: actions/checkout@v4

      - name: Load build config
        run: grep -vE '^\s*(#|$)' "binaries/${{ matrix.binary }}/build.env" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      # ── Security gate: reachability-aware vuln scan of the pinned source ──
      # govulncheck flags a vuln only if the built command actually reaches the
      # vulnerable symbol — the authoritative, low-noise gate for a third-party
      # tool we don't maintain. A reachable finding fails the build.
      - name: Fetch pinned source
        # REF may be a tag, branch, or commit SHA — `git clone --branch` only
        # accepts tags/branches, so init+fetch+checkout the specific ref.
        run: |
          git init -q .src
          git -C .src remote add origin "$REPO"
          git -C .src fetch --depth 1 -q origin "${REF:-$VERSION}"
          git -C .src checkout -q FETCH_HEAD

      - name: govulncheck (reachability gate)
        working-directory: .src
        run: |
          # Apply the same security dep overrides the image build uses, so the
          # gate verifies the exact module tree we ship.
          if [ -n "$GO_PATCHES" ]; then go get $GO_PATCHES && go mod tidy; fi
          # PINNED, not @latest: the gate below parses govulncheck's JSON, so its
          # schema is load-bearing for a safety decision. An unpinned upgrade that
          # restructured `finding.trace` would silently stop matching (see the
          # fail-closed check further down). Bumping this is a reviewable edit.
          #
          # The tool's own go line must stay <= GO_VERSION: under GOTOOLCHAIN=local
          # a govulncheck that outruns it cannot be installed at all, and that is
          # exactly how v1.8.0 (`go 1.26.0`) forced the 1.25 -> 1.26.8 move in
          # planning#185. Keep the two in step when bumping either.
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

          # Exit 3 means "vulnerabilities found", which is not a verdict yet —
          # the allowlist decides. Any other non-zero is a real tool failure.
          # `-format json` exits 0 EVEN WITH FINDINGS. Exit 3 ("vulnerabilities
          # found") is raised only by the text handler's Flush; the JSON handler
          # implements no Flush at all, so scan.Flush() returns nil for it
          # (x/vuln v1.8.0: internal/scan/run.go:81+160, jsonhandler.go,
          # internal/scan/text.go:84). So this exit code is a TOOL-FAILURE signal
          # and nothing more — never read it as a verdict about findings.
          set +e
          "$(go env GOPATH)/bin/govulncheck" -format json "$PKG/..." > govuln.json
          json_rc=$?
          set -e
          if [ "$json_rc" -ne 0 ]; then
            echo "::error::govulncheck (json) failed to run (exit $json_rc)"
            exit 1
          fi

          # Reachable == symbol-level: the trace names a function the built
          # command actually calls. Findings that are merely imported or
          # required carry no function, and filtering on it is what keeps this
          # gate low-noise — at cdncheck v1.3.1 that is 1 reachable finding
          # rather than 3.
          jq -r 'select(.finding != null)
                 | select(.finding.trace[0].function != null)
                 | .finding.osv' govuln.json | sort -u > reachable.txt

          # Human-readable rendering in the log for whoever has to act on it — and
          # the ORACLE for the cross-check below. Unlike json, text mode does exit 3,
          # and exactly when findings match the scan level (symbol, by default),
          # which is the same question the jq filter above asks.
          set +e
          "$(go env GOPATH)/bin/govulncheck" -format text "$PKG/..."
          text_rc=$?
          set -e
          if [ "$text_rc" -ne 0 ] && [ "$text_rc" -ne 3 ]; then
            echo "::error::govulncheck (text) failed to run (exit $text_rc)"
            exit 1
          fi

          # FAIL CLOSED. govuln-gate.sh treats an empty reachable.txt as a pass, so a
          # filter that silently stops matching — a schema change, a renamed field —
          # would disable the gate while looking identical to a clean scan. Two
          # renderings of the same scan must agree: if text says there are
          # symbol-level findings and our parse produced none, the parse is broken.
          # "No reachable findings" is thereby DERIVED, never merely the absence of
          # output.
          reach=$(grep -c . reachable.txt || true)
          if [ "$text_rc" -eq 3 ] && [ "$reach" -eq 0 ]; then
            echo "::error::govulncheck reports symbol-level findings but the JSON filter produced none — the filter or govulncheck's schema is broken, so this gate cannot be trusted"
            exit 1
          fi
          echo "cross-check ok: text_rc=$text_rc, $reach reachable finding(s) parsed"

          bash "$GITHUB_WORKSPACE/.github/scripts/govuln-gate.sh" reachable.txt

      # Building without pushing catches what govulncheck cannot: a Dockerfile
      # that no longer compiles, a bad build-arg, a base image that moved. That
      # class of breakage previously reached main before anything ran it.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: "binaries/${{ matrix.binary }}"
          push: false
          tags: "${{ matrix.binary }}:ci"   # local only; never resolved to a registry
          build-args: |
            REPO=${{ env.REPO }}
            VERSION=${{ env.VERSION }}
            REF=${{ env.REF }}
            PKG=${{ env.PKG }}
            BIN=${{ env.BIN }}
            GO_VERSION=${{ env.GO_VERSION }}
            GO_PATCHES=${{ env.GO_PATCHES }}

  # ── Publish: main and scheduled runs only ───────────────────────────────────
  # `needs: verify` means an unpublishable binary never reaches GHCR. The `if:`
  # is what keeps a pull request from publishing; `needs` alone would not.
  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push image to GHCR
      id-token: write        # OIDC for provenance attestation
      attestations: write    # write the SLSA provenance attestation
    strategy:
      fail-fast: false
      matrix:
        binary: [zgrab2, cdncheck]
    steps:
      - uses: actions/checkout@v4

      - name: Load build config
        run: grep -vE '^\s*(#|$)' "binaries/${{ matrix.binary }}/build.env" >> "$GITHUB_ENV"

      - name: Lowercase owner (GHCR requires lowercase)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # ── Build + publish the versioned image (static binary in scratch) ──
      # Note this recompiles what `verify` just built — layer cache does not
      # cross jobs. That is a deliberate trade: a few minutes on merge/schedule
      # runs (never on PRs, which run `verify` alone) in exchange for a hard
      # permission boundary. Passing the image between jobs as an artifact would
      # avoid it, at the cost of more moving parts in the path that signs what
      # we ship — not a trade worth making here.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: "binaries/${{ matrix.binary }}"
          push: true
          tags: "ghcr.io/${{ env.OWNER_LC }}/${{ matrix.binary }}:${{ env.VERSION }}"
          provenance: false   # SLSA provenance attested explicitly below
          build-args: |
            REPO=${{ env.REPO }}
            VERSION=${{ env.VERSION }}
            REF=${{ env.REF }}
            PKG=${{ env.PKG }}
            BIN=${{ env.BIN }}
            GO_VERSION=${{ env.GO_VERSION }}
            GO_PATCHES=${{ env.GO_PATCHES }}

      # ── SBOM + supply-chain provenance for the published artifact ──
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "ghcr.io/${{ env.OWNER_LC }}/${{ matrix.binary }}@${{ steps.build.outputs.digest }}"
          format: cyclonedx
          output: "sbom-${{ matrix.binary }}.cyclonedx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: "sbom-${{ matrix.binary }}"
          path: "sbom-${{ matrix.binary }}.cyclonedx.json"
          retention-days: 90

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: "ghcr.io/${{ env.OWNER_LC }}/${{ matrix.binary }}"
          subject-digest: "${{ steps.build.outputs.digest }}"
          push-to-registry: true

      - name: Summary
        run: |
          echo "### ${{ matrix.binary }} ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`ghcr.io/${OWNER_LC}/${{ matrix.binary }}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
